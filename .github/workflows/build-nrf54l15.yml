name: build nRF54L15 firmware

on:
  push:
    branches: [ "master", "lr2021-rx-order-fix" ]
  workflow_dispatch:  # allow manual trigger
    inputs:
      extra_cmake_args:
        description: 'Extra CMake args appended to the power-debug repeater job (e.g. -DCONFIG_LOG_DEFAULT_LEVEL=1)'
        required: false
        default: ''
        type: string

env:
  zephyr_sdk: 1.0.1
  python_version: 3.12
  toolchains: arm-zephyr-eabi

jobs:
  build-nrf54l15:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-python@v6
      with:
        python-version: '${{ env.python_version }}'
        cache: 'pip'
    - run: pip install -r requirements.txt
    
    - name: Setup Zephyr project
      uses: zephyrproject-rtos/action-zephyr-setup@v1
      with:
        app-path: zephcore
        toolchains: ${{ env.toolchains }}
        sdk-version: ${{ env.zephyr_sdk }}
    
    - name: Build companion (default)
      run: |
        west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine
        mkdir -p firmware
        cp build/zephyr/zephyr.hex firmware/ || true
        cp build/zephyr/zephyr.bin firmware/ || true
        cp build/zephyr/zephyr.elf firmware/ || true
        ls -la build/zephyr/
    
    - name: Upload companion firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-companion
        path: |
          firmware/
          build/zephyr/zephyr.hex
          build/zephyr/zephyr.bin
          build/zephyr/zephyr.elf
    
    - name: Build companion (2.4 GHz ISM variant)
      run: |
        west build -d build-2g4 -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
          -DCONFIG_ZEPHCORE_BAND_2G4=y
        ls -la build-2g4/zephyr/
    
    - name: Upload companion 2.4 GHz firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-companion-2g4
        path: |
          build-2g4/zephyr/zephyr.hex
          build-2g4/zephyr/zephyr.bin
          build-2g4/zephyr/zephyr.elf
    
    - name: Build companion (dual-band TDM variant)
      run: |
        west build -d build-tdm -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
          -DCONFIG_ZEPHCORE_RADIO_TDM=y
        ls -la build-tdm/zephyr/

    - name: Upload companion dual-band TDM firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-companion-tdm
        path: |
          build-tdm/zephyr/zephyr.hex
          build-tdm/zephyr/zephyr.bin
          build-tdm/zephyr/zephyr.elf

    - name: Build repeater
      run: |
        west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
          -DEXTRA_CONF_FILE="boards/common/repeater.conf"
        ls -la build/zephyr/
    
    - name: Upload repeater firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-repeater
        path: |
          build/zephyr/zephyr.hex
          build/zephyr/zephyr.bin
          build/zephyr/zephyr.elf

    - name: Build repeater (dual-band TDM variant)
      run: |
        west build -d build-tdm-rep -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
          -DEXTRA_CONF_FILE="boards/common/repeater.conf" -DCONFIG_ZEPHCORE_RADIO_TDM=y
        ls -la build-tdm-rep/zephyr/

    - name: Upload repeater dual-band TDM firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-repeater-tdm
        path: |
          build-tdm-rep/zephyr/zephyr.hex
          build-tdm-rep/zephyr/zephyr.bin
          build-tdm-rep/zephyr/zephyr.elf

    - name: Build repeater (packet logging variant for meshcoretomqtt)
      run: |
        west build -d build-pktlog -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
          -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/packet_logging.conf" -DCONFIG_ZEPHCORE_RADIO_TDM=y
        ls -la build-pktlog/zephyr/

    - name: Upload repeater packet-logging firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-repeater-pktlog
        path: |
          build-pktlog/zephyr/zephyr.hex
          build-pktlog/zephyr/zephyr.bin
          build-pktlog/zephyr/zephyr.elf

    - name: Build repeater (packet-logging healthcheck variant for hang diagnosis)
      run: |
        west build -d build-diag -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
          -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/healthcheck.conf" -DCONFIG_ZEPHCORE_RADIO_TDM=y
        ls -la build-diag/zephyr/

    - name: Upload repeater packet-logging healthcheck firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-repeater-pktlog-healthcheck
        path: |
          build-diag/zephyr/zephyr.hex
          build-diag/zephyr/zephyr.bin
          build-diag/zephyr/zephyr.elf

    - name: Build repeater (power-debug variant)
      run: |
        west build -d build-pwr -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
          -DEXTRA_CONF_FILE="boards/common/repeater.conf" -DCONFIG_ZEPHCORE_RADIO_TDM=y \
          -DCONFIG_ZEPHCORE_POWER_DEBUG=y -DCONFIG_GPIO_GET_CONFIG=y \
          -DCONFIG_LOG_BUFFER_SIZE=16384 \
          ${{ github.event.inputs.extra_cmake_args }}
        ls -la build-pwr/zephyr/

    - name: Upload repeater power-debug firmware
      uses: actions/upload-artifact@v7
      with:
        name: xiao_nrf54l15-repeater-power-debug
        path: |
          build-pwr/zephyr/zephyr.hex
          build-pwr/zephyr/zephyr.bin
          build-pwr/zephyr/zephyr.elf