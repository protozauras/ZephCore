# SPDX-License-Identifier: MIT
# Companion HF-ONLY variant (2026-08-29) — the home half of the bridge pair.
#
# Build with:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/packet_logging.conf;boards/common/companion_time_authority.conf;boards/common/companion_hf_only.conf"
#
# Purpose: pair with the remote bridge node over 2.4 GHz ONLY. The 868 MHz
# side is intentionally OFF at home — it "just gets in the way" while the
# bridge relays everything over HF. With ZEPHCORE_BAND_2G4=y the primary
# preset becomes 2450 MHz / BW500 / SF8 / CR4-5 / sync 0x12 / +12 dBm, and
# DualBandRadio::begin() self-disables the TDM scheduler (primary is already
# 2.4 GHz) — the radio listens on HF 100% of the time, no RX windows needed.
#
# NOTE: BAND_2G4 changes DEFAULTS only; saved LittleFS prefs would win.
# A full reflash wipes prefs, so after flashing this build the defaults apply.

CONFIG_ZEPHCORE_BAND_2G4=y
