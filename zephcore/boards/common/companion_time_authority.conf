# Companion passive-observer variant (no TX at all)
#
# Build with:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/packet_logging.conf;boards/common/companion_time_authority.conf"
#
# The companion is a PURE OBSERVER: it listens to the mesh (868 + HF
# backbone) and forwards what it hears over USB to the relay/MQTT for
# the maps, but NEVER transmits — no adverts, no ACKs, no replies.
# Enforced at Dispatcher::sendPacket via ZEPHCORE_COMPANION_OBSERVER_ONLY
# (Kconfig, default y for companion builds).
#
# If the companion must transmit again (clock-authority adverts, ACKs,
# chat), build with -DCONFIG_ZEPHCORE_COMPANION_OBSERVER_ONLY=n and set
# CONFIG_ZEPHCORE_COMPANION_PERIODIC_ADVERT_MIN as needed.

# Disable BLE: companion sits on Jetson with no phone — BLE blocks USB CLI
# input (usb_claim_active refuses text while BLE interface is active).
# Without BLE, the Jetson relay can send 'time <epoch>' over serial.
CONFIG_BT=n

# Entropy: without BLE, there's no built-in entropy source — add software RNG
CONFIG_ENTROPY_GENERATOR=y

# Periodic self-advert: DISABLED (0).  The observer never transmits, so a
# periodic advert would only be dropped at sendPacket — keep it off.
CONFIG_ZEPHCORE_COMPANION_PERIODIC_ADVERT_MIN=0

# Passive observer: drop all outbound packets (adverts, ACKs, replies).
CONFIG_ZEPHCORE_COMPANION_OBSERVER_ONLY=y

# Observer uses only the primary 868/869 MHz radio. No 2.4 GHz TDM/HF.
CONFIG_ZEPHCORE_RADIO_TDM=n
