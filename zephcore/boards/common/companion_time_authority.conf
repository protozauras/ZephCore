# Companion time-authority variant (A2: periodic self-advert)
#
# Build with:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/companion_time_authority.conf"
#
# Enables a periodic flood self-advert every 2 minutes so a field repeater
# (built with timesync2node.conf, bootstrap quorum 1) can restore its clock
# from the companion's advert timestamp even when no other nodes are in
# range.  The advert carries the companion's RTC time signed with Ed25519;
# MeshTimeSync on the repeater validates tenure before stepping.
#
# Pair with timesync2node.conf on the repeater side for the full A1+A2
# clock-recovery path (CLOCK_ISSUE.md §4).
CONFIG_ZEPHCORE_COMPANION_PERIODIC_ADVERT_MIN=2
