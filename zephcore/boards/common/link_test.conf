# Link Test role config — neutral 2.4 GHz range tester (RANGE_TEST_PLAN.md)
#
# Build with (role via the tx/rx override conf — Kconfig string values must
# come from a .conf file, west/cmake strip the quotes from -D arguments):
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/link_test.conf;boards/common/link_test_tx.conf"   (TX)
#     -DEXTRA_CONF_FILE="boards/common/link_test.conf;boards/common/link_test_rx.conf"   (RX)
#
# NO mesh, NO TDM, NO sub-GHz — the radio stays on the 2.4 GHz preset
# 2450/BW500/SF8/CR4/5 @ +12 dBm the whole time (ZEPHCORE_BAND_2G4,
# hard-pinned again in main_link_test.cpp pin_2g4_preset()).
# This build must NEVER transmit on sub-GHz 868.

# ========== Role Selection ==========
CONFIG_ZEPHCORE_ROLE_LINK_TEST=y
CONFIG_ZEPHCORE_BAND_2G4=y

# ========== Disable BLE entirely (like repeater.conf) ==========
# Zero BLE functionality — saves flash/RAM; nothing in the link-test
# main calls bt_enable().
CONFIG_BT=n

# ========== Entropy (required when BT is disabled) ==========
# Core sources (Identity/RNG) pull in the entropy subsystem; BT normally
# provides it.
CONFIG_ENTROPY_GENERATOR=y

# ========== Clean USB-serial output (packet_logging style) ==========
# printk goes straight to the console UART (SAMD11 bridge → USB CDC),
# bypassing the log system; module logs silenced so the terminal shows
# only RSSI/SNR/seq lines and NO SIGNAL.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=n

CONFIG_ZEPHCORE_LORA_LOG_LEVEL_OFF=y
CONFIG_ZEPHCORE_BOARD_LOG_LEVEL_OFF=y
CONFIG_LORA_LOG_LEVEL_OFF=y
