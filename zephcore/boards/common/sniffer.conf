# RF Sniffer role config — passive dual-band listener (ACTION_PLAN.md).
#
# NEVER transmits: the sniffer main (src/main_sniffer.cpp) has no TX call
# path, no mesh, no BLE, no TDM.  Band leg is chosen by ZEPHCORE_SNIFFER_LEG
# (lora868 / ook433 / hop) — a Kconfig STRING, so it must be set in a .conf
# file (sniffer_lora868.conf / sniffer_ook433.conf / sniffer_hop.conf),
# never via -D (west/cmake strip the quotes → "malformed string literal").
#
# Build example:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/sniffer.conf;boards/common/sniffer_hop.conf"

# ========== Role Selection ==========
CONFIG_ZEPHCORE_ROLE_SNIFFER=y

# ========== Disable BLE entirely (like repeater.conf / link_test.conf) ==========
CONFIG_BT=n

# ========== Entropy (required when BT is disabled) ==========
CONFIG_ENTROPY_GENERATOR=y

# ========== Clean USB-serial output (link_test.conf style) ==========
# printk goes straight to the console UART (SAMD11 bridge → USB CDC),
# bypassing the log system; module logs silenced so the terminal shows
# only LORA/OOK/HOP lines.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=n

CONFIG_ZEPHCORE_LORA_LOG_LEVEL_OFF=y
CONFIG_ZEPHCORE_BOARD_LOG_LEVEL_OFF=y
CONFIG_LORA_LOG_LEVEL_OFF=y
