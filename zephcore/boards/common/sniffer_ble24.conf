# Sniffer leg: BLE advertising channels 37/38/39 (2.4 GHz, passive RX).
#
# Rotates 37 → 38 → 39 every CONFIG_ZEPHCORE_SNIFFER_BLE_DWELL_MS; the
# chip dewhitens + CRC-checks natively (per-channel whitening inits in
# main_sniffer.cpp, from lr2021-apps ble_txrx.rs).
CONFIG_ZEPHCORE_SNIFFER_LEG="ble24"
CONFIG_ZEPHCORE_SNIFFER_BLE_DWELL_MS=2000
