# Sniffer leg: 868.95 MHz wM-Bus — native WM-BUS modem (passive RX).
#
# T1 = one-way meter mode (the common EU electricity/water/heat meters
# transmit T1 at 868.95 MHz; C1 = the "compact" one-way variant on the
# same channel — switch via CONFIG_ZEPHCORE_SNIFFER_WMBUS_MODE).
CONFIG_ZEPHCORE_SNIFFER_LEG="mbus868"
CONFIG_ZEPHCORE_SNIFFER_WMBUS_MODE="T1"
