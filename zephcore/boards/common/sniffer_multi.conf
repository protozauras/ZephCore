# Sniffer leg: multi — fast TDM phase cycler (ACTION_PLAN_2 F3, ~36 s).
#
# Cycle: lora mesh (SF8 BW62.5 @ 869.618) → LoRaWAN CAD (868.1/3/5 +
# 869.525 + mesh) → wM-Bus 868.95 (T1/C1 alternating per cycle) →
# OOK 433.92(rtl_433) → BLE 37/38/39 → RSSI sweep 860-870/100 kHz.
# Passive RX only; every phase logs "HOP -> <phase> (ret=%d)".
CONFIG_ZEPHCORE_SNIFFER_LEG="multi"

# Phase durations (defaults = the ACTION_PLAN_2 table).
CONFIG_ZEPHCORE_SNIFFER_MULTI_LORA_S=8
CONFIG_ZEPHCORE_SNIFFER_MULTI_WMBUS_S=8
CONFIG_ZEPHCORE_SNIFFER_MULTI_OOK_S=6
CONFIG_ZEPHCORE_SNIFFER_MULTI_BLE_MS=6000
CONFIG_ZEPHCORE_SNIFFER_MULTI_SWEEP_MS=4000

# wM-Bus mode A (T1) / B (C1) alternate every cycle; the conf value is
# the FIRST-cycle mode (wmbus_mode_code in main_sniffer.cpp).
CONFIG_ZEPHCORE_SNIFFER_WMBUS_MODE="T1"
