# Repeater clock-recovery variant (CLOCK_ISSUE.md §4)
#
# Build with:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/timesync2node.conf"
#
# Lowers the mesh time-sync BOOTSTRAP_QUORUM from 3 to 1: a field repeater
# with no BLE/GPS/RTC recovers its clock from a SINGLE in-range neighbor
# after a power cycle (instead of sitting at 1970 deaf until someone
# attaches USB).  Normal-mode quorum (ZEPHCORE_TIMESYNC_QUORUM, 6) is
# untouched — steady-state stepping still needs a majority.
CONFIG_ZEPHCORE_TIMESYNC_BOOTSTRAP_QUORUM=1
