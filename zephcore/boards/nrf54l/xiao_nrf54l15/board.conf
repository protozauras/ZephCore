# Seeed XIAO nRF54L15 + Wio-LR2021
# Board-specific configuration

# Board identification
CONFIG_ZEPHCORE_BOARD_NAME="XIAO nRF54L15"

# Device Information Service model name
CONFIG_BT_DIS_MODEL_NUMBER_STR="XIAO nRF54L15"

# FLPR core reserves 68KB of RAM; 450 contacts is the ceiling that fits
CONFIG_ZEPHCORE_MAX_CONTACTS=450

# ========== Power Management ==========
# nRFX power driver — needed for proper DCDC/LDO regulator config.
# Without this, the nRF54L15 internal regulators may not be configured
# correctly, potentially causing brown-out on battery power.
CONFIG_NRFX_POWER=y

# LR2021 radio driver (not SX1262!)
CONFIG_ZEPHCORE_RADIO_LR2021=y

# ========== Power savings for BLE companion ==========
# XIAO nRF54L15 + Wio-LR2021 is a BLE companion: phone + LoRa, nothing else.
# Disable subsystems that zephcore_common.conf enables for other boards.

# No GNSS module on this board
CONFIG_GNSS=n
CONFIG_MODEM_MODULES=n

# No battery ADC on nRF54L15
CONFIG_ADC=n

# No external sensors — disable I2C bus (OLED off, no I2C sensors).
# MCU die temperature sensor (nordic,nrf-temp) is internal, needs CONFIG_SENSOR=y.
CONFIG_SENSOR=y
CONFIG_I2C=n

# UART console ON for radio diagnostics
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Debug logging — radio driver diagnostics
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_ZEPHCORE_LORA_LOG_LEVEL=4
